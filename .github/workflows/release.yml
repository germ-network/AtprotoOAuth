name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Never cut a tag whose manifest carries a branch:/revision: dependency pin —
  # such a release can't be resolved by any versioned consumer (see 0.6.1→0.6.2).
  # Runs in the swift container so `dump-package` is the authoritative detector.
  guard:
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'germ-network' }}
    name: Stable-pin guard
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Reject unstable (branch/revision) dependency pins
        shell: bash
        run: |
          set -o pipefail
          swift package dump-package | swift scripts/check-stable-pins.swift

  release:
    needs: guard
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'germ-network' }}
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          check-latest: true
          cache: pnpm

      - name: Create Pull Request for next release or Publish a new github release
        id: changesets
        uses: changesets/action@v1

        with:
          title: Prepare next release
          createGithubReleases: true
          publish: pnpm release
          version: pnpm version-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
