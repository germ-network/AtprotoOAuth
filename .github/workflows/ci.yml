name: CI

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  testPackage:
    name: Test MacOS Package
    runs-on: macOS-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "platform=macOS,variant=Mac Catalyst"
          - "platform=iOS Simulator,name=iPhone 17e"
          - "platform=iOS Simulator,name=iPhone Air"
          # - "platform=tvOS Simulator,name=Apple TV"
          # - "platform=watchOS Simulator,name=Apple Watch Series 10 (42mm)"
          # - "platform=visionOS Simulator,name=Apple Vision Pro"
    steps:
      - uses: actions/checkout@v5
      - name: Test platform ${{ matrix.destination }}
        run: set -o pipefail && xcodebuild -skipMacroValidation -scheme AtprotoOAuth-Package -destination "${{ matrix.destination }}" test | xcbeautify
  testMocks:
    name: Test MacOS Mocks
    runs-on: macOS-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "platform=macOS,variant=Mac Catalyst"
          - "platform=iOS Simulator,name=iPhone 17e"
          - "platform=iOS Simulator,name=iPhone Air"
          # - "platform=tvOS Simulator,name=Apple TV"
          # - "platform=watchOS Simulator,name=Apple Watch Series 10 (42mm)"
          # - "platform=visionOS Simulator,name=Apple Vision Pro"
    steps:
      - uses: actions/checkout@v5
      - name: Test platform ${{ matrix.destination }}
        run: set -o pipefail && xcodebuild -skipMacroValidation -scheme AtprotoOAuthMocks -destination "${{ matrix.destination }}" build | xcbeautify
  testDemoApp:
      name: Test MacOS Demo App
      runs-on: macOS-26
      timeout-minutes: 30
      env:
        DEVELOPER_DIR: /Applications/Xcode_26.2.app
      strategy:
        matrix:
          destination:
            - "platform=macOS"
            # - "platform=macOS,variant=Mac Catalyst"
            - "platform=iOS Simulator,name=iPhone 17e"
            - "platform=iOS Simulator,name=iPhone Air"
            # - "platform=tvOS Simulator,name=Apple TV"
            # - "platform=watchOS Simulator,name=Apple Watch Series 10 (42mm)"
            # - "platform=visionOS Simulator,name=Apple Vision Pro"
      steps:
        - uses: actions/checkout@v5
        - name: Test platform ${{ matrix.destination }}
          run: set -o pipefail && xcodebuild -skipMacroValidation -scheme AtprotoOAuthDemoApp -destination "${{ matrix.destination }}" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""| xcbeautify
          working-directory: Demos/AtprotoApp/
  linux_test:
    name: Test Linux
    runs-on: ubuntu-latest
    container:
      image: swift:${{matrix.swift-version}}
    timeout-minutes: 30
    strategy:
      matrix:
        swift-version:
          - "latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: swift --version
      - name: Test
        run: swift test

  linux-android:
    name: Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: "Test Swift Package on Android"
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: '6.3'
