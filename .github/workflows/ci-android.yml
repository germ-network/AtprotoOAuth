name: Android

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux-android:
    name: Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: "Test Swift Package on Android"
        id: android
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: '6.3'
      # The library and its dependency closure must not link FoundationNetworking.
      # `--target` builds just that closure.
      - name: "Library does not link FoundationNetworking"
        run: |
          ${{ steps.android.outputs.swift-build }} --scratch-path .build-scan --target AtprotoOAuth
          scripts/scan-foundation-networking.sh .build-scan
      # Control: the scanner must flag a target that does import it, or a pass
      # above could just mean it is not seeing the autolink entry. Built into a
      # separate scratch path so the objects scanned are exactly that product's.
      - name: "Scanner detects FoundationNetworking in the URLSession product"
        run: |
          ${{ steps.android.outputs.swift-build }} --scratch-path .build-scan-control --target GermConvenienceURLSession
          scripts/scan-foundation-networking.sh --expect .build-scan-control
